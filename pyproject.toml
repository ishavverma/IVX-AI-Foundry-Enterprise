[project]
name = "ai-foundry-enterprise"
version = "0.1.0"
description = "AI Foundry Enterprise — An integrated AI operating platform for the full lifecycle of foundation models."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "flask>=3.0",
    "flask-login>=0.6",
    "flask-wtf>=1.2",
    "flask-limiter>=3.8",
    "flask-sock>=0.7",
    "apispec>=6.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "bcrypt>=4.0",
    "pyjwt>=2.8",
    "psutil>=5.9",
    "humanize>=4.9",
    "click>=8.1",
    "rich>=13.0",
    "apscheduler>=3.10",
    "boto3>=1.34",
    "prometheus-client>=0.20",
    "celery>=5.4",
    "redis>=5.0",
    "cryptography>=42.0",
    "gunicorn>=22.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
gpu = [
    "pynvml>=11.5",
    "torch>=2.2",
]
ml = [
    "torch>=2.2",
    "transformers>=4.40",
    "accelerate>=0.30",
    "peft>=0.11",
    "tokenizers>=0.19",
    "safetensors>=0.4",
    "datasets>=2.19",
    "evaluate>=0.4",
    "sentencepiece>=0.2",
]
inference = [
    "vllm>=0.4",
    "llama-cpp-python>=0.2.90",
]
kubernetes = [
    "kubernetes>=30.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"
