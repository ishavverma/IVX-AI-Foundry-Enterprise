apiVersion: v1
kind: Secret
metadata:
  name: {{ include "afe.fullname" . }}
type: Opaque
stringData:
  AFE_DATABASE_URL: {{ .Values.secret.databaseUrl | quote }}
  AFE_REDIS_URL: {{ .Values.secret.redisUrl | quote }}
  AFE_SECRET_KEY: {{ .Values.secret.secretKey | quote }}
  AFE_S3_ENDPOINT: {{ .Values.secret.s3Endpoint | quote }}
  AFE_S3_ACCESS_KEY: {{ .Values.secret.s3AccessKey | quote }}
  AFE_S3_SECRET_KEY: {{ .Values.secret.s3SecretKey | quote }}
  AFE_S3_BUCKET: {{ .Values.secret.s3Bucket | quote }}
