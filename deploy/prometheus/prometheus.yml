global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'afe-local'
    environment: 'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "rules/*.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # AFE Web Application
  - job_name: 'afe-web'
    static_configs:
      - targets: ['web:5000']
    metrics_path: '/metrics'

  # AFE Worker
  - job_name: 'afe-worker'
    static_configs:
      - targets: ['worker:5000']
    metrics_path: '/metrics'

  # PostgreSQL
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  # Node Exporter (host metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['host.docker.internal:9100']

  # cAdvisor (container metrics)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['host.docker.internal:8080']