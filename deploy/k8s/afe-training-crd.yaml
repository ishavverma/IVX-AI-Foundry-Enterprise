apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: afetrainingjobs.ivx.ai
spec:
  group: ivx.ai
  scope: Namespaced
  names:
    plural: afetrainingjobs
    singular: afetrainingjob
    kind: AFETrainingJob
    shortNames: [afejob]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [experimentId]
              properties:
                experimentId: {type: string}
                image: {type: string, default: ivx:latest}
                gpuCount: {type: integer, minimum: 0, default: 1}
                queue: {type: string, default: default}
      subresources:
        status: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ivx-training-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ivx-training-operator
spec:
  replicas: 1
  selector:
    matchLabels: {app: ivx-training-operator}
  template:
    metadata:
      labels: {app: ivx-training-operator}
    spec:
      serviceAccountName: ivx-training-operator
      containers:
        - name: operator
          image: ivx:operator
          env:
            - name: AFE_QUEUE_BACKEND
              value: redis
            - name: AFE_REDIS_URL
              valueFrom:
                secretKeyRef: {name: ivx-runtime, key: redis-url}
