{% extends "base.html" %}
{% block title %}Sign in - AI Foundry Enterprise{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 460px;">
    <div class="afe-card p-4">
        <h1 class="h4 mb-1">Sign in</h1>
        <p class="text-secondary mb-4">Access your AI Foundry workspace.</p>
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label class="form-label">Username or email</label>
            <input class="form-control mb-3" name="username" autocomplete="username" required>
            <label class="form-label">Password</label>
            <input class="form-control mb-4" type="password" name="password" autocomplete="current-password" required>
            <button class="btn afe-btn-primary w-100" type="submit">Sign in</button>
        </form>
        <p class="text-secondary small mt-4 mb-0">No account? <a href="{{ url_for('auth.register') }}">Create one</a></p>
            <p class="text-secondary small mt-4 mb-0">Access is provisioned by your organization administrator.</p>
    </div>
</div>
{% endblock %}
