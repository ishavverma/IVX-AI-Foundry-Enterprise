{% extends "base.html" %}
{% block title %}Create Autonomous Agent — AI Foundry Enterprise{% endblock %}

{% block content %}
<div class="afe-animate-fade" style="max-width: 800px; margin: 0 auto;">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h1 class="h4 fw-bold mb-1">Create Autonomous Agent</h1>
            <p class="text-secondary mb-0" style="font-size: 0.85rem;">Define agent persona, tool privileges, and step budgets.</p>
        </div>
        <a href="/agents" class="btn afe-btn-ghost"><i class="bi bi-arrow-left me-1"></i>Back</a>
    </div>

    <div class="afe-card">
        <form method="POST" action="/agents/new">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label small fw-bold">Agent Name</label>
                <input type="text" name="name" class="form-control" placeholder="e.g. Autonomous Code Refactor Agent" required>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold">Role & Domain Description</label>
                <textarea name="role_description" class="form-control" rows="2" placeholder="Describe the agent's primary domain and scope of execution…" required></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold">System Instructions</label>
                <textarea name="system_instructions" class="form-control font-monospace" rows="3" placeholder="You are an autonomous engineering agent with access to code evaluation and tool execution."></textarea>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold mb-2">Available Tools & Capabilities</label>
                <div class="d-flex flex-column gap-2">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="tools" value="calculator" id="calcTool" checked>
                        <label class="form-check-label small" for="calcTool">Calculator (Analytical Math & Expression Verification)</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="tools" value="code_eval" id="evalTool" checked>
                        <label class="form-check-label small" for="evalTool">Python Code Sandbox (Execution & Unit Testing)</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="tools" value="search_docs" id="searchTool" checked>
                        <label class="form-check-label small" for="searchTool">Knowledge Base & Documentation Search</label>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a href="/agents" class="btn afe-btn-ghost">Cancel</a>
                <button type="submit" class="btn afe-btn-primary"><i class="bi bi-robot me-1"></i>Create Agent</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
